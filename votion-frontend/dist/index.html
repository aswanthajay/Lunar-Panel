      /* Global Preloader — White background in Light Mode, Black in Dark Mode */
      .votion-preloader {
        position: fixed;
        top: 0; left: 0;

      .votion-preloader.dark .votion-preloader-logo,

        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
      }
      @keyframes votion-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.95); }
      }

    <script>
      (function() {
        try {
          var t = localStorage.getItem('votion_theme');
          var isDark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.removeAttribute('data-theme');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
