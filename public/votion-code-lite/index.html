<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Votion Code Lite</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./out/vs/workbench/workbench.web.main.internal.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #181818;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #votion-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #181818;
            color: #cccccc;
            z-index: 999999;
            transition: opacity 0.4s ease;
        }
        .votion-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #2b2b2b;
            border-top-color: #007ACC;
            border-radius: 50%;
            animation: vspin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes vspin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body aria-label="">
    <div id="votion-splash">
        <div class="votion-spinner"></div>
        <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.2px;">Opening Votion Code Lite...</div>
        <div style="font-size: 11px; color: #8b949e; margin-top: 6px; font-family: monospace;">Mounting server workspace via Web API</div>
    </div>

    <!-- Startup script -->
    <script>
        const baseUrl = new URL('.', window.location.href).toString().replace(/\/+$/, '');
        globalThis._VSCODE_FILE_ROOT = baseUrl + '/out/';
    </script>
    <script type="module" src="./out/nls.messages.js"></script>
    <script type="module">
        import { create, URI } from './out/vs/workbench/workbench.web.main.internal.js';

        // Retrieve server UUID from query params
        const urlParams = new URLSearchParams(window.location.search);
        const serverUuid = urlParams.get('server') || '';

        // Extract CSRF cookie
        let csrfToken = '';
        const cookieMatch = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
        if (cookieMatch) {
            csrfToken = decodeURIComponent(cookieMatch[1]);
        }

        const workspaceFolderUri = URI.from({
            scheme: 'ptero',
            authority: serverUuid,
            path: '/',
            query: csrfToken ? `csrf=${encodeURIComponent(csrfToken)}` : ''
        });

        const extensionUri = URI.from({
            scheme: window.location.protocol.replace(':', ''),
            authority: window.location.host,
            path: baseUrl.replace(window.location.origin, '') + '/extensions/pterodactyl-fs'
        });

        create(document.body, {
            workspaceProvider: {
                workspace: {
                    folderUri: workspaceFolderUri
                },
                open: async () => true
            },
            productConfiguration: {
                nameShort: 'Votion Code',
                nameLong: 'Votion Code Lite',
                applicationName: 'votion-code-lite'
            },
            options: {
                additionalBuiltinExtensions: [
                    extensionUri
                ]
            }
        }).then(() => {
            const splash = document.getElementById('votion-splash');
            if (splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 400);
                }, 500);
            }
        }).catch((err) => {
            console.error('Failed to initialize Votion Code Lite:', err);
            const splash = document.getElementById('votion-splash');
            if (splash) {
                splash.innerHTML = `
                    <div style="color: #f85149; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Failed to initialize Votion Code Lite</div>
                    <div style="color: #8b949e; font-size: 12px; font-family: monospace; max-width: 480px; text-align: center;">${err.message || err}</div>
                `;
            }
        });
    </script>
</body>
</html>
