<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Votion Code Lite</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./out/vs/workbench/workbench.web.main.internal.css?v=2.6">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #181818;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color-scheme: dark;
        }
        #votion-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #181818;
            color: #cccccc;
            z-index: 999999;
            transition: opacity 0.4s ease;
        }
        .votion-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #2b2b2b;
            border-top-color: #007ACC;
            border-radius: 50%;
            animation: vspin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes vspin {
            to { transform: rotate(360deg); }
        }

        /* Enforce Dark Modern / code-server supported color palette across all VS Code Web elements */
        :root {
            color-scheme: dark;
            --vscode-editorGroupHeader-tabsBackground: #181818 !important;
            --vscode-editorGroupHeader-tabsBorder: #2b2b2b !important;
            --vscode-tab-activeBackground: #1f1f1f !important;
            --vscode-tab-inactiveBackground: #181818 !important;
            --vscode-tab-activeForeground: #ffffff !important;
            --vscode-tab-inactiveForeground: #9d9d9d !important;
            --vscode-tab-border: #2b2b2b !important;
            --vscode-tab-activeBorderTop: #0078d4 !important;
            --vscode-editor-background: #1f1f1f !important;
            --vscode-editor-foreground: #cccccc !important;
            --vscode-sideBar-background: #181818 !important;
            --vscode-sideBar-border: #2b2b2b !important;
            --vscode-sideBarSectionHeader-background: #181818 !important;
            --vscode-sideBarSectionHeader-border: #2b2b2b !important;
            --vscode-list-activeSelectionBackground: #04395e !important;
            --vscode-list-activeSelectionForeground: #ffffff !important;
            --vscode-list-inactiveSelectionBackground: #2a2d2e !important;
            --vscode-list-inactiveSelectionForeground: #cccccc !important;
            --vscode-list-hoverBackground: #2a2d2e !important;
            --vscode-list-focusBackground: #04395e !important;
            --vscode-activityBar-background: #181818 !important;
            --vscode-activityBar-border: #2b2b2b !important;
            --vscode-statusBar-background: #181818 !important;
            --vscode-statusBar-border: #2b2b2b !important;
            --vscode-titleBar-activeBackground: #181818 !important;
            --vscode-titleBar-border: #2b2b2b !important;
            --vscode-breadcrumb-background: #1f1f1f !important;
            --vscode-panel-background: #181818 !important;
            --vscode-panel-border: #2b2b2b !important;
            --vscode-terminal-background: #181818 !important;
            --vscode-terminal-foreground: #cccccc !important;
            --vscode-terminal-border: #2b2b2b !important;
            --vscode-editorWidget-background: #1f1f1f !important;
            --vscode-editorWidget-border: #2b2b2b !important;
            --vscode-editorWidget-foreground: #cccccc !important;
            --vscode-input-background: #1f1f1f !important;
            --vscode-input-foreground: #cccccc !important;
            --vscode-input-border: #2b2b2b !important;
            --vscode-dropdown-background: #1f1f1f !important;
            --vscode-dropdown-border: #2b2b2b !important;
            --vscode-dropdown-foreground: #cccccc !important;
        }

        /* Panel, bottom dock, terminal, and widgets styling */
        .monaco-workbench .part.panel,
        .monaco-workbench .part.panel .composite.title,
        .monaco-workbench .part.panel .panel-switcher-container,
        .monaco-workbench .part.panel .content {
            background-color: #181818 !important;
        }
        .monaco-workbench .part.panel .monaco-action-bar .action-item.checked {
            border-bottom-color: #0078d4 !important;
        }
        .monaco-workbench .terminal-outer-container,
        .monaco-workbench .terminal-wrapper,
        .monaco-workbench .xterm,
        .monaco-workbench .xterm-viewport {
            background-color: #181818 !important;
        }
        .monaco-workbench .editor-widget,
        .monaco-workbench .monaco-findInput,
        .monaco-workbench .find-widget {
            background-color: #1f1f1f !important;
            border-color: #2b2b2b !important;
        }

        /* Prevent white background in tab header strip */
        .monaco-workbench .part.editor > .content .editor-group-container > .title,
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-and-actions-container,
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container {
            background-color: #181818 !important;
            background: #181818 !important;
        }
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container > .tab {
            background-color: #181818 !important;
            border-right: 1px solid #2b2b2b !important;
            border-bottom: none !important;
        }
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container > .tab.active,
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container > .tab.selected {
            background-color: #1f1f1f !important;
            border-top: 1px solid #0078d4 !important;
        }
        .monaco-workbench .part.editor > .content .editor-group-container > .title .editor-actions {
            background-color: #181818 !important;
        }

        /* Sidebar & Explorer file list styling (prevent stark white row) */
        .monaco-workbench .part.sidebar,
        .monaco-workbench .part.sidebar .composite.title,
        .monaco-workbench .part.sidebar .monaco-list,
        .monaco-workbench .part.sidebar .monaco-list-rows {
            background-color: #181818 !important;
        }
        .monaco-workbench .monaco-list:focus .monaco-list-row.selected {
            background-color: #04395e !important;
            color: #ffffff !important;
        }
        .monaco-workbench .monaco-list .monaco-list-row.selected {
            background-color: #2a2d2e !important;
            color: #ffffff !important;
        }
        .monaco-workbench .monaco-list .monaco-list-row:hover:not(.selected) {
            background-color: #2a2d2e !important;
        }

        /* Editor area and line highlight normalizations (no white outline box) */
        .monaco-workbench .part.editor,
        .monaco-workbench .part.editor > .content,
        .monaco-workbench .part.editor .monaco-editor,
        .monaco-workbench .part.editor .monaco-editor-background {
            background-color: #1f1f1f !important;
        }
        .monaco-editor .current-line {
            border: none !important;
            outline: none !important;
            background-color: rgba(255, 255, 255, 0.04) !important;
        }
        .monaco-editor .lines-decorations {
            background: transparent !important;
        }

        /* Breadcrumbs bar */
        .monaco-workbench .part.editor .breadcrumbs-below-tabs,
        .monaco-workbench .breadcrumbs-widget {
            background-color: #1f1f1f !important;
        }
    </style>
</head>
<body aria-label="">
    <div id="votion-splash">
        <div class="votion-spinner"></div>
        <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.2px;">Opening Votion Code Lite...</div>
        <div style="font-size: 11px; color: #8b949e; margin-top: 6px; font-family: monospace;">Mounting server workspace via REST API</div>
    </div>

    <!-- Startup script -->
    <script>
        const baseUrl = new URL('.', window.location.href).toString().replace(/\/+$/, '');
        globalThis._VSCODE_FILE_ROOT = baseUrl + '/out/';
        globalThis._VSCODE_PRODUCT_JSON = {
            enableTelemetry: false,
            aiConfig: null
        };
    </script>
    <script type="module" src="./out/nls.messages.js"></script>
    <script type="module">
        import { create, URI, Emitter, Event, window as vsWindow, commands } from './out/vs/workbench/workbench.web.main.internal.js?v=2.6';

        // Retrieve server UUID from query params
        const urlParams = new URLSearchParams(window.location.search);
        const serverUuid = (urlParams.get('server') || '').toLowerCase();

        // Extract CSRF token
        let csrfToken = urlParams.get('csrf') || '';
        if (!csrfToken) {
            const m = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            if (m) csrfToken = decodeURIComponent(m[1]);
        }
        if (!csrfToken) {
            try {
                if (window.parent && window.parent.document) {
                    const meta = window.parent.document.querySelector('meta[name="csrf-token"]');
                    if (meta) csrfToken = meta.getAttribute('content') || '';
                    if (!csrfToken && window.parent.document.cookie) {
                        const pm = window.parent.document.cookie.match(/XSRF-TOKEN=([^;]+)/);
                        if (pm) csrfToken = decodeURIComponent(pm[1]);
                    }
                }
            } catch (e) {}
        }

        function createFsError(message, code) {
            const err = new Error(message);
            err.name = `${code} (FileSystemError)`;
            err.code = code;
            return err;
        }

        function encodePath(path) {
            if (!path || path === '/' || path === '') return '/';
            let p = path.replace(/\\/g, '/');
            if (!p.startsWith('/')) p = '/' + p;
            if (p.length > 1 && p.endsWith('/')) p = p.substring(0, p.length - 1);
            return p.split('/').map(s => encodeURIComponent(s)).join('/');
        }

        class PterodactylFileSystemProvider {
            constructor(uuid, csrf) {
                this.serverUuid = uuid;
                this.csrfToken = csrf;
                // FileReadWrite (2) | PathCaseSensitive (1024)
                this.capabilities = 2 | 1024;
                this._onDidChangeFile = new Emitter();
                this.onDidChangeFile = this._onDidChangeFile.event;
                this.onDidChangeCapabilities = Event.None;
                this.cache = new Map();
                this.notFoundCache = new Set();
                this.knownRootChildren = new Set();
                this.hasLoadedRoot = false;
                this._rootLoadPromise = null;
            }

            async ensureRootLoaded() {
                if (this.hasLoadedRoot) return;
                if (this._rootLoadPromise) return this._rootLoadPromise;
                this._rootLoadPromise = (async () => {
                    try {
                        const encodedDir = encodePath('/');
                        const res = await this.request('/files/list?directory=' + encodedDir);
                        const json = await res.json();
                        const items = json.data || [];

                        this.knownRootChildren.clear();
                        for (const item of items) {
                            const attr = item.attributes;
                            if (!attr || !attr.name) continue;
                            const isFile = attr.is_file ?? (attr.file ?? true);
                            const type = isFile ? 1 : 2;
                            this.knownRootChildren.add(attr.name);

                            const childPath = '/' + attr.name;
                            const relChildPath = attr.name;
                            const statObj = {
                                type,
                                ctime: attr.created_at ? new Date(attr.created_at).getTime() : 0,
                                mtime: attr.modified_at ? new Date(attr.modified_at).getTime() : 0,
                                size: typeof attr.size === 'number' ? attr.size : (Number(attr.size) || 0),
                                permissions: undefined
                            };
                            this.cache.set(childPath, statObj);
                            this.cache.set(relChildPath, statObj);
                            this.notFoundCache.delete(childPath);
                            this.notFoundCache.delete(relChildPath);
                        }
                    } catch (e) {
                        console.warn('[VotionCodeLite] Failed to load root directory:', e);
                    } finally {
                        this.hasLoadedRoot = true;
                    }
                })();
                return this._rootLoadPromise;
            }

            getCleanPath(resource) {
                let p = (resource && resource.path) ? resource.path : '/';
                p = p.replace(/\\/g, '/');
                if (!p.startsWith('/')) p = '/' + p;
                if (p.length > 1 && p.endsWith('/')) p = p.substring(0, p.length - 1);
                return p;
            }

            isKnownNotFound(path) {
                const clean = this.getCleanPath({ path });
                if (clean === '/' || clean === '') return false;
                if (this.notFoundCache.has(clean)) return true;

                // Check ancestor path components
                const parts = clean.split('/').filter(Boolean);
                let acc = '';
                for (let i = 0; i < parts.length; i++) {
                    acc += '/' + parts[i];
                    if (this.notFoundCache.has(acc)) {
                        this.notFoundCache.add(clean);
                        return true;
                    }
                }

                // If root listing has completed and top-level item is not in root
                if (this.hasLoadedRoot && parts.length > 0) {
                    const topLevel = parts[0];
                    if (!this.knownRootChildren.has(topLevel)) {
                        this.notFoundCache.add(clean);
                        return true;
                    }
                }
                return false;
            }

            async request(endpoint, options = {}) {
                const origin = window.location.origin;
                const url = origin + '/api/client/servers/' + this.serverUuid + endpoint;
                const headers = {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    ...(this.csrfToken ? {
                        'X-CSRF-TOKEN': this.csrfToken,
                        'X-XSRF-TOKEN': this.csrfToken
                    } : {}),
                    ...(options.headers || {})
                };

                const res = await fetch(url, {
                    ...options,
                    credentials: 'include',
                    headers
                });

                if (!res.ok) {
                    let detail = '';
                    try {
                        const json = await res.json();
                        detail = json?.errors?.[0]?.detail || json?.message || '';
                    } catch (e) {}

                    const errMsg = detail || res.statusText || `HTTP ${res.status}`;

                    // Pterodactyl Wings returns 404 or 500 when a file or directory does not exist.
                    // Throw standard EntryNotFound FileSystemError so VS Code handles it gracefully without errors.
                    if (res.status === 404 || res.status === 500 || res.status === 502) {
                        throw createFsError(detail || 'File not found', 'EntryNotFound');
                    }
                    if (res.status === 403) {
                        throw createFsError(detail || 'Permission denied', 'NoPermissions');
                    }
                    console.warn(`[VotionCodeLite] API ${res.status} on ${endpoint}: ${errMsg}`);
                    throw new Error('Pterodactyl API error (' + res.status + '): ' + errMsg);
                }
                return res;
            }

            async stat(resource) {
                const path = this.getCleanPath(resource);
                if (path === '/' || path === '') {
                    return {
                        type: 2, // Directory
                        ctime: 0,
                        mtime: 0,
                        size: 0,
                        permissions: undefined
                    };
                }

                await this.ensureRootLoaded();

                if (this.isKnownNotFound(path)) {
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }

                if (this.cache.has(path)) {
                    return this.cache.get(path);
                }
                const relPath = path.startsWith('/') ? path.substring(1) : path;
                if (this.cache.has(relPath)) {
                    return this.cache.get(relPath);
                }

                // Query parent directory to populate child stats
                const lastSlash = path.lastIndexOf('/');
                const parentDir = lastSlash <= 0 ? '/' : path.substring(0, lastSlash);

                // If parentDir is root and item is not in cache, it definitely doesn't exist in root
                if (parentDir === '/') {
                    this.notFoundCache.add(path);
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }

                if (this.isKnownNotFound(parentDir)) {
                    this.notFoundCache.add(path);
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }

                try {
                    await this.readdir({ path: parentDir });
                } catch (e) {
                    this.notFoundCache.add(parentDir);
                    this.notFoundCache.add(path);
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }

                if (this.cache.has(path)) {
                    return this.cache.get(path);
                }
                if (this.cache.has(relPath)) {
                    return this.cache.get(relPath);
                }

                this.notFoundCache.add(path);
                throw createFsError('File not found: ' + path, 'EntryNotFound');
            }

            async readdir(resource) {
                const dir = this.getCleanPath(resource);
                const queryDir = (dir === '/' || dir === '') ? '/' : dir;

                if (queryDir === '/') {
                    await this.ensureRootLoaded();
                    const result = [];
                    for (const name of this.knownRootChildren) {
                        const statObj = this.cache.get('/' + name);
                        result.push([name, statObj ? statObj.type : 1]);
                    }
                    return result;
                }

                await this.ensureRootLoaded();
                if (this.isKnownNotFound(queryDir)) {
                    throw createFsError('Directory not found: ' + queryDir, 'EntryNotFound');
                }

                try {
                    const encodedDir = encodePath(queryDir);
                    const res = await this.request('/files/list?directory=' + encodedDir);
                    const json = await res.json();
                    const items = json.data || [];

                    const result = [];
                    for (const item of items) {
                        const attr = item.attributes;
                        if (!attr || !attr.name) continue;
                        const isFile = attr.is_file ?? (attr.file ?? true);
                        const type = isFile ? 1 : 2;
                        result.push([attr.name, type]);

                        const childPath = dir === '/' ? '/' + attr.name : dir + '/' + attr.name;
                        const relChildPath = childPath.startsWith('/') ? childPath.substring(1) : childPath;
                        const statObj = {
                            type,
                            ctime: attr.created_at ? new Date(attr.created_at).getTime() : 0,
                            mtime: attr.modified_at ? new Date(attr.modified_at).getTime() : 0,
                            size: typeof attr.size === 'number' ? attr.size : (Number(attr.size) || 0),
                            permissions: undefined
                        };
                        this.cache.set(childPath, statObj);
                        this.cache.set(relChildPath, statObj);
                        this.notFoundCache.delete(childPath);
                        this.notFoundCache.delete(relChildPath);
                    }
                    return result;
                } catch (err) {
                    this.notFoundCache.add(queryDir);
                    throw createFsError('Directory not found: ' + queryDir, 'EntryNotFound');
                }
            }

            async readFile(resource) {
                const path = this.getCleanPath(resource);
                await this.ensureRootLoaded();
                if (this.isKnownNotFound(path)) {
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }

                try {
                    const res = await this.request('/files/contents?file=' + encodePath(path));
                    const buf = await res.arrayBuffer();
                    return new Uint8Array(buf);
                } catch (err) {
                    this.notFoundCache.add(path);
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }
            }

            async writeFile(resource, content, opts) {
                const path = this.getCleanPath(resource);
                await this.request('/files/write?file=' + encodePath(path), {
                    method: 'POST',
                    body: content,
                    headers: { 'Content-Type': 'text/plain' }
                });

                this.cache.delete(path);
                const rel = path.startsWith('/') ? path.substring(1) : path;
                this.cache.delete(rel);
                this.notFoundCache.delete(path);
                this.notFoundCache.delete(rel);
                const parts = path.split('/').filter(Boolean);
                if (parts.length > 0) this.knownRootChildren.add(parts[0]);
                this._onDidChangeFile.fire([{ type: 0 /* Updated */, resource }]);
            }

            async mkdir(resource) {
                const path = this.getCleanPath(resource);
                const lastSlash = path.lastIndexOf('/');
                const root = lastSlash <= 0 ? '/' : path.substring(0, lastSlash);
                const name = path.substring(lastSlash + 1);

                await this.request('/files/create-folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ root, name })
                });

                this.cache.delete(path);
                const rel = path.startsWith('/') ? path.substring(1) : path;
                this.cache.delete(rel);
                this.notFoundCache.delete(path);
                this.notFoundCache.delete(rel);
                const parts = path.split('/').filter(Boolean);
                if (parts.length > 0) this.knownRootChildren.add(parts[0]);
                this._onDidChangeFile.fire([{ type: 1 /* Added */, resource }]);
            }

            async delete(resource, opts) {
                const path = this.getCleanPath(resource);
                const lastSlash = path.lastIndexOf('/');
                const root = lastSlash <= 0 ? '/' : path.substring(0, lastSlash);
                const name = path.substring(lastSlash + 1);

                await this.request('/files/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ root, files: [name] })
                });

                this.cache.delete(path);
                const rel = path.startsWith('/') ? path.substring(1) : path;
                this.cache.delete(rel);
                this.notFoundCache.add(path);
                this.notFoundCache.add(rel);
                if (root === '/' && this.knownRootChildren.has(name)) {
                    this.knownRootChildren.delete(name);
                }
                this._onDidChangeFile.fire([{ type: 2 /* Deleted */, resource }]);
            }

            async rename(from, to, opts) {
                const fromPath = this.getCleanPath(from);
                const toPath = this.getCleanPath(to);

                const fromLastSlash = fromPath.lastIndexOf('/');
                const root = fromLastSlash <= 0 ? '/' : fromPath.substring(0, fromLastSlash);
                const fromName = fromPath.substring(fromLastSlash + 1);
                const toName = toPath.substring(toPath.lastIndexOf('/') + 1);

                await this.request('/files/rename', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ root, files: [{ from: fromName, to: toName }] })
                });

                this.cache.delete(fromPath);
                this.cache.delete(toPath);
                const relFrom = fromPath.startsWith('/') ? fromPath.substring(1) : fromPath;
                const relTo = toPath.startsWith('/') ? toPath.substring(1) : toPath;
                this.cache.delete(relFrom);
                this.cache.delete(relTo);
                this.notFoundCache.add(fromPath);
                this.notFoundCache.delete(toPath);
                if (root === '/') {
                    this.knownRootChildren.delete(fromName);
                    this.knownRootChildren.add(toName);
                }

                this._onDidChangeFile.fire([
                    { type: 2 /* Deleted */, resource: from },
                    { type: 1 /* Added */, resource: to }
                ]);
            }

            watch(resource, opts) {
                return { dispose: () => {} };
            }
        }

        const workspaceFolderUri = URI.from({
            scheme: 'ptero',
            authority: serverUuid,
            path: '/'
        });

        const pteroFsProvider = new PterodactylFileSystemProvider(serverUuid, csrfToken);
        // Expose globally so workbench.web.main.internal.js can auto-register whenever needed
        window.pteroFsProvider = pteroFsProvider;

        // Persistent terminal state & buffers
        const allTerminalLines = [];
        let hasReceivedLogs = false;
        let activeServerPty = null;
        let serverTerminalInstance = null;
        let hookedXterm = null;
        let currentInputBuffer = '';
        let isPromptRendered = false;
        let commandHistory = [];
        let historyIndex = -1;

        try {
            const savedHist = localStorage.getItem(`votion_term_history_${serverUuid}`);
            if (savedHist) commandHistory = JSON.parse(savedHist);
        } catch (e) {}

        function saveHistory() {
            try {
                localStorage.setItem(`votion_term_history_${serverUuid}`, JSON.stringify(commandHistory.slice(0, 50)));
            } catch (e) {}
        }

        const BANNER = [
            '\x1b[38;2;59;130;246m┌─────────────────────────────────────────────────────────────────┐\x1b[0m\r\n',
            '\x1b[38;2;59;130;246m│\x1b[0m  \x1b[1;37mVOTION CODE\x1b[0m — \x1b[38;2;16;185;129mServer Console & Interactive Terminal\x1b[0m         \x1b[38;2;59;130;246m│\x1b[0m\r\n',
            '\x1b[38;2;59;130;246m│\x1b[0m  \x1b[90mConnected to server container. Type server commands below.     \x1b[38;2;59;130;246m│\x1b[0m\r\n',
            '\x1b[38;2;59;130;246m└─────────────────────────────────────────────────────────────────┘\x1b[0m\r\n\r\n'
        ].join('');

        const PROMPT = '\x1b[38;2;16;185;129mcontainer@votion\x1b[0m:\x1b[38;2;59;130;246m~\x1b[0m$ ';

        function formatLogLine(line, kind) {
            if (!line) return '';
            let clean = String(line).replace(/(?:\r\n|\r|\n)$/, '').replace(/\r?\n/g, '\r\n');

            // Filter raw HTML gateway error bodies (e.g. 502 Bad Gateway)
            if (/<!doctype\s+html|<html[\s>]/i.test(clean)) {
                const titleMatch = clean.match(/<title>([^<]+)<\/title>/i);
                const errTitle = titleMatch ? titleMatch[1].trim() : 'Upstream Gateway Error';
                clean = `\x1b[38;2;248;113;113m[system] [Gateway Error: ${errTitle}] Upstream daemon connection issue\x1b[0m`;
            }

            let formatted;
            if (kind === 'error') {
                formatted = `\x1b[38;2;248;113;113m${clean}\x1b[0m\r\n`;
            } else if (kind === 'daemon') {
                formatted = `\x1b[38;2;113;113;122m[system]\x1b[0m \x1b[38;2;248;113;113m[Daemon Error]\x1b[0m ${clean}\r\n`;
            } else if (kind === 'system') {
                formatted = `\x1b[38;2;113;113;122m[system]\x1b[0m ${clean}\r\n`;
            } else if (kind === 'install') {
                formatted = `\x1b[38;2;245;158;11m[install]\x1b[0m ${clean}\r\n`;
            } else if (kind === 'transfer') {
                formatted = `\x1b[38;2;59;130;246m[transfer]\x1b[0m ${clean}\r\n`;
            } else {
                if (clean.includes('\x1b[')) {
                    formatted = `${clean}\x1b[0m\r\n`;
                } else if (/\b(?:error|exception|fatal|severe|failure|panic)\b/i.test(clean)) {
                    formatted = `\x1b[38;2;248;113;113m${clean}\x1b[0m\r\n`;
                } else if (/\b(?:warn|warning|alert)\b/i.test(clean)) {
                    formatted = `\x1b[38;2;245;158;11m${clean}\x1b[0m\r\n`;
                } else {
                    formatted = `${clean}\r\n`;
                }
            }
            return formatted;
        }

        function receiveServerLog(line, kind) {
            if (!line) return;
            hasReceivedLogs = true;
            const formatted = formatLogLine(line, kind);
            if (!formatted) return;

            allTerminalLines.push(formatted);
            if (allTerminalLines.length > 2500) allTerminalLines.shift();

            if (hookedXterm) {
                if (isPromptRendered) {
                    hookedXterm.write('\r\x1b[K');
                    hookedXterm.write(formatted);
                    hookedXterm.write(PROMPT + currentInputBuffer);
                } else {
                    hookedXterm.write(formatted);
                }
            }

            if (activeServerPty && activeServerPty.writeEmitter) {
                try {
                    activeServerPty.writeEmitter.fire(formatted);
                } catch (e) {}
            }
        }

        function receiveBatchLogs(logs, status) {
            if (Array.isArray(logs) && logs.length > 0) {
                hasReceivedLogs = true;
                const batch = [];
                for (const item of logs) {
                    const l = item.data || item.line || item;
                    const k = item.kind || 'output';
                    const f = formatLogLine(l, k);
                    if (f) {
                        allTerminalLines.push(f);
                        batch.push(f);
                    }
                }
                if (allTerminalLines.length > 2500) {
                    allTerminalLines.splice(0, allTerminalLines.length - 2500);
                }

                if (hookedXterm) {
                    if (isPromptRendered) {
                        hookedXterm.write('\r\x1b[K');
                    }
                    for (const chunk of batch) {
                        hookedXterm.write(chunk);
                    }
                    hookedXterm.write(PROMPT + currentInputBuffer);
                    isPromptRendered = true;
                }
            }

            if (status) {
                receiveServerStatus(status);
            }
        }

        function receiveServerStatus(status) {
            const msg = `\r\n\x1b[38;2;113;113;122m[system]\x1b[0m \x1b[90mInstance transitioned to \x1b[1;37m${status}\x1b[0m\r\n`;
            allTerminalLines.push(msg);
            if (hookedXterm) {
                if (isPromptRendered) {
                    hookedXterm.write('\r\x1b[K');
                    hookedXterm.write(msg);
                    hookedXterm.write(PROMPT + currentInputBuffer);
                } else {
                    hookedXterm.write(msg);
                }
            }
            if (activeServerPty && activeServerPty.writeEmitter) {
                try {
                    activeServerPty.writeEmitter.fire(msg);
                } catch (e) {}
            }
        }

        let lastInputTime = 0;
        let lastInputData = null;

        function handleTerminalInput(data, source) {
            if (!data) return;
            const now = performance.now();
            if (data === lastInputData && (now - lastInputTime) < 35) {
                return;
            }
            lastInputTime = now;
            lastInputData = data;

            // Enter key -> Execute command
            if (data === '\r' || data === '\n') {
                if (hookedXterm) {
                    hookedXterm.write('\r\n');
                }
                const cmd = currentInputBuffer.trim();
                currentInputBuffer = '';
                isPromptRendered = false;

                if (cmd.length > 0) {
                    commandHistory.unshift(cmd);
                    if (commandHistory.length > 50) commandHistory.pop();
                    historyIndex = -1;
                    saveHistory();
                    sendCommand(cmd);
                }

                if (hookedXterm) {
                    hookedXterm.write(PROMPT);
                    isPromptRendered = true;
                }
                return;
            }

            // Backspace
            if (data === '\x7f' || data === '\b') {
                if (currentInputBuffer.length > 0) {
                    currentInputBuffer = currentInputBuffer.slice(0, -1);
                    if (hookedXterm) {
                        hookedXterm.write('\b \b');
                    }
                }
                return;
            }

            // Ctrl+C (Interrupt/cancel line)
            if (data === '\x03') {
                if (hookedXterm) {
                    hookedXterm.write('^C\r\n' + PROMPT);
                }
                currentInputBuffer = '';
                historyIndex = -1;
                isPromptRendered = true;
                return;
            }

            // Ctrl+U (Clear current line buffer)
            if (data === '\x15') {
                currentInputBuffer = '';
                historyIndex = -1;
                if (hookedXterm) {
                    hookedXterm.write('\r\x1b[K' + PROMPT);
                }
                isPromptRendered = true;
                return;
            }

            // Arrow Up (History back)
            if (data === '\x1b[A') {
                if (historyIndex + 1 < commandHistory.length) {
                    historyIndex++;
                    setPromptBuffer(commandHistory[historyIndex]);
                }
                return;
            }

            // Arrow Down (History forward)
            if (data === '\x1b[B') {
                if (historyIndex > 0) {
                    historyIndex--;
                    setPromptBuffer(commandHistory[historyIndex]);
                } else if (historyIndex === 0) {
                    historyIndex = -1;
                    setPromptBuffer('');
                }
                return;
            }

            // Printable character or pasted text
            if (data >= ' ' || data.length > 1) {
                if (data.startsWith('\x1b') && data.length <= 4) return;
                currentInputBuffer += data;
                if (hookedXterm) {
                    hookedXterm.write(data);
                }
            }
        }

        function setPromptBuffer(newStr) {
            currentInputBuffer = newStr || '';
            if (hookedXterm) {
                hookedXterm.write('\r\x1b[K' + PROMPT + currentInputBuffer);
                isPromptRendered = true;
            }
        }

        function sendCommand(cmd) {
            if (!cmd) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'VOTION_SEND_COMMAND', command: cmd }, '*');
            }
            if (directSocket && directSocket.readyState === WebSocket.OPEN) {
                try {
                    directSocket.send(JSON.stringify({ event: 'send command', args: [cmd] }));
                } catch (e) {}
            }
        }

        let directSocket = null;
        let directWsConnected = false;
        let directWsAttempted = false;

        function connectDirectWs() {
            if (directWsAttempted || hasReceivedLogs || !serverUuid) return;
            directWsAttempted = true;
            fetch(`/api/client/servers/${serverUuid}/websocket`, {
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(r => r.json())
            .then(data => {
                if (!data?.data?.token || !data?.data?.socket) return;
                const ws = new WebSocket(data.data.socket);
                directSocket = ws;
                ws.onopen = () => {
                    ws.send(JSON.stringify({ event: 'auth', args: [data.data.token] }));
                };
                ws.onmessage = (event) => {
                    try {
                        const parsed = JSON.parse(event.data);
                        if (parsed.event === 'auth success') {
                            directWsConnected = true;
                            ws.send(JSON.stringify({ event: 'send logs', args: [null] }));
                        } else if ((parsed.event === 'console output' || parsed.event === 'install output' || parsed.event === 'transfer logs') && Array.isArray(parsed.args)) {
                            for (const l of parsed.args) {
                                receiveServerLog(l, 'output');
                            }
                        } else if (parsed.event === 'daemon error' && Array.isArray(parsed.args)) {
                            for (const l of parsed.args) {
                                receiveServerLog(l, 'error');
                            }
                        } else if (parsed.event === 'daemon message' && Array.isArray(parsed.args)) {
                            for (const l of parsed.args) {
                                receiveServerLog(l, 'daemon');
                            }
                        } else if (parsed.event === 'status' && Array.isArray(parsed.args)) {
                            receiveServerStatus(parsed.args[0]);
                        }
                    } catch (err) {}
                };
            })
            .catch(() => {});
        }

        function requestLogsFromParent() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'VOTION_READY' }, '*');
                window.parent.postMessage({ type: 'VOTION_REQUEST_LOGS' }, '*');
            }
        }

        // Attach window message listener IMMEDIATELY
        window.addEventListener('message', (e) => {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'VOTION_SERVER_LOG') {
                receiveServerLog(e.data.data, e.data.kind);
            } else if (e.data.type === 'VOTION_SERVER_LOG_BATCH') {
                receiveBatchLogs(e.data.logs, e.data.status);
            } else if (e.data.type === 'VOTION_SERVER_STATUS') {
                receiveServerStatus(e.data.status);
            }
        });

        requestLogsFromParent();

        function hookXtermInstance(xterm, wrapper) {
            if (!xterm || xterm.__votionHooked) return;
            xterm.__votionHooked = true;
            hookedXterm = xterm;

            try {
                xterm.options.disableStdin = false;
                xterm.options.cursorBlink = true;
                xterm.options.cursorStyle = 'block';
            } catch (e) {}

            xterm.clear();
            xterm.write(BANNER);
            for (const line of allTerminalLines) {
                xterm.write(line);
            }
            xterm.write(PROMPT + currentInputBuffer);
            isPromptRendered = true;

            if (typeof xterm.onData === 'function') {
                xterm.onData((data) => {
                    handleTerminalInput(data, 'xterm');
                });
            }

            const focusXterm = () => {
                try { xterm.focus(); } catch (e) {}
            };

            if (wrapper) {
                wrapper.addEventListener('click', focusXterm);
                wrapper.addEventListener('mousedown', focusXterm);
            }

            const panel = document.querySelector('.part.panel') || document.querySelector('.terminal-outer-container');
            if (panel) {
                panel.addEventListener('click', focusXterm);
            }

            setTimeout(focusXterm, 50);
            setTimeout(focusXterm, 300);
        }

        function findAndHookXterm() {
            const wrappers = document.querySelectorAll('.terminal-wrapper');
            for (const wrapper of wrappers) {
                if (wrapper.xterm && !wrapper.xterm.__votionHooked) {
                    hookXtermInstance(wrapper.xterm, wrapper);
                    return true;
                }
            }
            return false;
        }

        const xtermHookInterval = setInterval(() => {
            if (findAndHookXterm()) {
                clearInterval(xtermHookInterval);
                setInterval(findAndHookXterm, 400);
            }
        }, 50);

        const domObserver = new MutationObserver(() => {
            findAndHookXterm();
        });
        domObserver.observe(document.body, { childList: true, subtree: true });

        class ServerPseudoterminal {
            constructor(uuid, csrf) {
                this.serverUuid = uuid;
                this.csrfToken = csrf;
                this.writeEmitter = new Emitter();
                this.closeEmitter = new Emitter();
                this.onDidWrite = this.writeEmitter.event;
                this.onDidClose = this.closeEmitter.event;
            }

            open(dimensions) {
                findAndHookXterm();
                requestLogsFromParent();
                setTimeout(() => {
                    requestLogsFromParent();
                    if (!hasReceivedLogs) {
                        connectDirectWs();
                    }
                }, 1500);
            }

            setDimensions(dim) {
                findAndHookXterm();
            }

            handleInput(data) {
                handleTerminalInput(data, 'pty');
            }

            close() {
                if (directSocket) {
                    try { directSocket.close(); } catch (e) {}
                    directSocket = null;
                }
                this.closeEmitter.fire();
            }
        }

        function createServerTerminal() {
            if (activeServerPty && serverTerminalInstance) {
                return serverTerminalInstance;
            }
            activeServerPty = new ServerPseudoterminal(serverUuid, csrfToken);
            serverTerminalInstance = vsWindow.createTerminal({
                name: 'Server Console',
                pty: activeServerPty
            });
            return serverTerminalInstance;
        }

        function dismissSplash() {
            const splash = document.getElementById('votion-splash');
            if (splash && splash.style.opacity !== '0') {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 400);
            }
        }

        // Clear any stale cached theme settings and extensions cache from localStorage so VS Code Web reliably initializes
        try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                if (k && (k.includes('theme') || k.includes('colorTheme') || k.includes('colorCustomizations') || k.includes('additionalBuiltinExtensions') || k.includes('systemExtensionsCache'))) {
                    localStorage.removeItem(k);
                }
            }
        } catch (e) {}

        const darkModernCustomizations = {
            "panel.background": "#181818",
            "panel.border": "#2b2b2b",
            "panelTitle.activeBorder": "#0078d4",
            "panelTitle.activeForeground": "#ffffff",
            "panelTitle.inactiveForeground": "#9d9d9d",
            "terminal.background": "#181818",
            "terminal.foreground": "#cccccc",
            "terminal.border": "#2b2b2b",
            "terminalCursor.foreground": "#ffffff",
            "terminal.ansiBlack": "#000000",
            "terminal.ansiRed": "#f87171",
            "terminal.ansiGreen": "#10b981",
            "terminal.ansiYellow": "#f59e0b",
            "terminal.ansiBlue": "#3b82f6",
            "terminal.ansiMagenta": "#a855f7",
            "terminal.ansiCyan": "#06b6d4",
            "terminal.ansiWhite": "#e5e7eb",
            "terminal.ansiBrightBlack": "#4b5563",
            "terminal.ansiBrightRed": "#fca5a5",
            "terminal.ansiBrightGreen": "#34d399",
            "terminal.ansiBrightYellow": "#fbbf24",
            "terminal.ansiBrightBlue": "#60a5fa",
            "terminal.ansiBrightMagenta": "#c084fc",
            "terminal.ansiBrightCyan": "#22d3ee",
            "terminal.ansiBrightWhite": "#ffffff",
            "editorGroupHeader.tabsBackground": "#181818",
            "editorGroupHeader.noTabsBackground": "#181818",
            "tab.activeBackground": "#1f1f1f",
            "tab.inactiveBackground": "#181818",
            "tab.activeForeground": "#ffffff",
            "tab.inactiveForeground": "#9d9d9d",
            "tab.border": "#2b2b2b",
            "tab.activeBorderTop": "#0078d4",
            "sideBar.background": "#181818",
            "sideBar.border": "#2b2b2b",
            "sideBarSectionHeader.background": "#181818",
            "sideBarSectionHeader.border": "#2b2b2b",
            "sideBarSectionHeader.foreground": "#cccccc",
            "sideBarTitle.foreground": "#cccccc",
            "editor.background": "#1f1f1f",
            "editor.foreground": "#cccccc",
            "editor.lineHighlightBackground": "#ffffff0a",
            "editor.lineHighlightBorder": "#00000000",
            "editorWidget.background": "#1f1f1f",
            "editorWidget.border": "#2b2b2b",
            "editorWidget.foreground": "#cccccc",
            "list.activeSelectionBackground": "#04395e",
            "list.activeSelectionForeground": "#ffffff",
            "list.inactiveSelectionBackground": "#2a2d2e",
            "list.inactiveSelectionForeground": "#cccccc",
            "list.hoverBackground": "#2a2d2e",
            "list.focusBackground": "#04395e",
            "activityBar.background": "#181818",
            "activityBar.border": "#2b2b2b",
            "statusBar.background": "#181818",
            "statusBar.border": "#2b2b2b",
            "titleBar.activeBackground": "#181818",
            "titleBar.border": "#2b2b2b",
            "breadcrumb.background": "#1f1f1f",
            "breadcrumb.foreground": "#9d9d9d",
            "breadcrumb.focusForeground": "#e0e0e0",
            "breadcrumb.activeSelectionForeground": "#ffffff",
            "input.background": "#1f1f1f",
            "input.foreground": "#cccccc",
            "input.border": "#2b2b2b",
            "dropdown.background": "#1f1f1f",
            "dropdown.border": "#2b2b2b",
            "dropdown.foreground": "#cccccc"
        };

        try {
            // Preload root server directory so all file probes know instantly if folders/files exist
            await pteroFsProvider.ensureRootLoaded();

            create(document.body, {
                disableTelemetry: true,
                fileSystemProviders: [
                    {
                        scheme: 'ptero',
                        provider: pteroFsProvider
                    }
                ],
                workspaceProvider: {
                    workspace: {
                        folderUri: workspaceFolderUri
                    },
                    open: async () => true
                },
                initialColorTheme: {
                    themeType: 'dark',
                    colors: darkModernCustomizations
                },
                configurationDefaults: {
                    "telemetry.telemetryLevel": "off",
                    "telemetry.enableTelemetry": false,
                    "telemetry.enableCrashReporter": false,
                    "workbench.colorTheme": "Default Dark Modern",
                    "workbench.preferredDarkColorTheme": "Default Dark Modern",
                    "workbench.preferredLightColorTheme": "Default Dark Modern",
                    "workbench.preferredHighContrastColorTheme": "Default Dark Modern",
                    "workbench.preferredHighContrastLightColorTheme": "Default Dark Modern",
                    "window.autoDetectColorScheme": false,
                    "window.autoDetectHighContrast": false,
                    "workbench.startupEditor": "none",
                    "workbench.welcomePage.walkthroughs.openOnInstall": false,
                    "workbench.tips.enabled": false,
                    "workbench.panel.defaultLocation": "bottom",
                    "terminal.integrated.cursorBlinking": true,
                    "terminal.integrated.cursorStyle": "block",
                    "terminal.integrated.gpuAcceleration": "off",
                    "terminal.integrated.fontSize": 12,
                    "terminal.integrated.lineHeight": 1.2,
                    "terminal.integrated.fontFamily": "Menlo, Monaco, 'Courier New', monospace",
                    "terminal.integrated.scrollback": 5000,
                    "files.autoSave": "onFocusChange",
                    "workbench.colorCustomizations": darkModernCustomizations,
                    "editor.autoIndent": "advanced",
                    "editor.formatOnSave": false,
                    "editor.formatOnPaste": true,
                    "editor.formatOnType": true,
                    "[python]": {
                        "editor.tabSize": 4,
                        "editor.insertSpaces": true,
                        "editor.autoIndent": "advanced"
                    }
                },
                productConfiguration: {
                    nameShort: 'Votion Code',
                    nameLong: 'Votion Code Lite',
                    applicationName: 'votion-code-lite',
                    webEndpointUrlTemplate: '',
                    version: '1.136.1',
                    commit: 'a44adf7f53e00964ab890f9f8758a334f1fc15bc',
                    quality: 'stable',
                    enableTelemetry: false,
                    aiConfig: null
                },
                commands: [
                    {
                        id: 'workbench.action.terminal.new',
                        handler: () => {
                            createServerTerminal();
                        }
                    }
                ]
            });

            // Automatically create and reveal the Server Console terminal in VS Code's built-in bottom panel
            createServerTerminal();

            // Smoothly remove splash screen as soon as the workbench DOM element is mounted
            let splashDismissed = false;
            const checkWorkbench = () => {
                if (splashDismissed) return;
                if (document.querySelector('.monaco-workbench')) {
                    splashDismissed = true;
                    dismissSplash();
                }
            };

            const observer = new MutationObserver(() => checkWorkbench());
            observer.observe(document.body, { childList: true, subtree: true });
            const checkTimer = setInterval(checkWorkbench, 100);

            // Safety timeout
            setTimeout(() => {
                clearInterval(checkTimer);
                observer.disconnect();
                dismissSplash();
            }, 3000);
        } catch (err) {
            console.error('Failed to initialize Votion Code Lite:', err);
            const splash = document.getElementById('votion-splash');
            if (splash) {
                splash.innerHTML = `
                    <div style="color: #f85149; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Failed to initialize Votion Code Lite</div>
                    <div style="color: #8b949e; font-size: 12px; font-family: monospace; max-width: 480px; text-align: center;">${err.message || err}</div>
                `;
            }
        }
    </script>
