<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Votion Code Lite</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./out/vs/workbench/workbench.web.main.internal.css?v=2.6">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #181818;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color-scheme: dark;
        }
        #votion-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #181818;
            color: #cccccc;
            z-index: 999999;
            transition: opacity 0.4s ease;
        }
        .votion-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #2b2b2b;
            border-top-color: #007ACC;
            border-radius: 50%;
            animation: vspin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes vspin {
            to { transform: rotate(360deg); }
        }

        /* Enforce Dark Modern / code-server supported color palette across all VS Code Web elements */
        :root {
            color-scheme: dark;
            --vscode-editorGroupHeader-tabsBackground: #181818 !important;
            --vscode-editorGroupHeader-tabsBorder: #2b2b2b !important;
            --vscode-tab-activeBackground: #1f1f1f !important;
            --vscode-tab-inactiveBackground: #181818 !important;
            --vscode-tab-activeForeground: #ffffff !important;
            --vscode-tab-inactiveForeground: #9d9d9d !important;
            --vscode-tab-border: #2b2b2b !important;
            --vscode-tab-activeBorderTop: #0078d4 !important;
            --vscode-editor-background: #1f1f1f !important;
            --vscode-editor-foreground: #cccccc !important;
            --vscode-sideBar-background: #181818 !important;
            --vscode-sideBar-border: #2b2b2b !important;
            --vscode-sideBarSectionHeader-background: #181818 !important;
            --vscode-sideBarSectionHeader-border: #2b2b2b !important;
            --vscode-list-activeSelectionBackground: #04395e !important;
            --vscode-list-activeSelectionForeground: #ffffff !important;
            --vscode-list-inactiveSelectionBackground: #2a2d2e !important;
            --vscode-list-inactiveSelectionForeground: #cccccc !important;
            --vscode-list-hoverBackground: #2a2d2e !important;
            --vscode-list-focusBackground: #04395e !important;
            --vscode-activityBar-background: #181818 !important;
            --vscode-activityBar-border: #2b2b2b !important;
            --vscode-statusBar-background: #181818 !important;
            --vscode-statusBar-border: #2b2b2b !important;
            --vscode-titleBar-activeBackground: #181818 !important;
            --vscode-titleBar-border: #2b2b2b !important;
            --vscode-breadcrumb-background: #1f1f1f !important;
            --vscode-panel-background: #181818 !important;
            --vscode-panel-border: #2b2b2b !important;
            --vscode-terminal-background: #181818 !important;
            --vscode-terminal-foreground: #cccccc !important;
            --vscode-terminal-border: #2b2b2b !important;
            --vscode-editorWidget-background: #1f1f1f !important;
            --vscode-editorWidget-border: #2b2b2b !important;
            --vscode-editorWidget-foreground: #cccccc !important;
            --vscode-input-background: #1f1f1f !important;
            --vscode-input-foreground: #cccccc !important;
            --vscode-input-border: #2b2b2b !important;
            --vscode-dropdown-background: #1f1f1f !important;
            --vscode-dropdown-border: #2b2b2b !important;
            --vscode-dropdown-foreground: #cccccc !important;
        }

        /* Panel, bottom dock, terminal, and widgets styling */
        .monaco-workbench .part.panel,
        .monaco-workbench .part.panel .composite.title,
        .monaco-workbench .part.panel .panel-switcher-container,
        .monaco-workbench .part.panel .content {
            background-color: #181818 !important;
        }
        .monaco-workbench .part.panel .monaco-action-bar .action-item.checked {
            border-bottom-color: #0078d4 !important;
        }
        .monaco-workbench .terminal-outer-container,
        .monaco-workbench .terminal-wrapper,
        .monaco-workbench .xterm,
        .monaco-workbench .xterm-viewport {
            background-color: #181818 !important;
        }
        .monaco-workbench .editor-widget,
        .monaco-workbench .monaco-findInput,
        .monaco-workbench .find-widget {
            background-color: #1f1f1f !important;
            border-color: #2b2b2b !important;
        }

        /* Prevent white background in tab header strip */
        .monaco-workbench .part.editor > .content .editor-group-container > .title,
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-and-actions-container,
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container {
            background-color: #181818 !important;
            background: #181818 !important;
        }
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container > .tab {
            background-color: #181818 !important;
            border-right: 1px solid #2b2b2b !important;
            border-bottom: none !important;
        }
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container > .tab.active,
        .monaco-workbench .part.editor > .content .editor-group-container > .title .tabs-container > .tab.selected {
            background-color: #1f1f1f !important;
            border-top: 1px solid #0078d4 !important;
        }
        .monaco-workbench .part.editor > .content .editor-group-container > .title .editor-actions {
            background-color: #181818 !important;
        }

        /* Sidebar & Explorer file list styling (prevent stark white row) */
        .monaco-workbench .part.sidebar,
        .monaco-workbench .part.sidebar .composite.title,
        .monaco-workbench .part.sidebar .monaco-list,
        .monaco-workbench .part.sidebar .monaco-list-rows {
            background-color: #181818 !important;
        }
        .monaco-workbench .monaco-list:focus .monaco-list-row.selected {
            background-color: #04395e !important;
            color: #ffffff !important;
        }
        .monaco-workbench .monaco-list .monaco-list-row.selected {
            background-color: #2a2d2e !important;
            color: #ffffff !important;
        }
        .monaco-workbench .monaco-list .monaco-list-row:hover:not(.selected) {
            background-color: #2a2d2e !important;
        }

        /* Editor area and line highlight normalizations (no white outline box) */
        .monaco-workbench .part.editor,
        .monaco-workbench .part.editor > .content,
        .monaco-workbench .part.editor .monaco-editor,
        .monaco-workbench .part.editor .monaco-editor-background {
            background-color: #1f1f1f !important;
        }
        .monaco-editor .current-line {
            border: none !important;
            outline: none !important;
            background-color: rgba(255, 255, 255, 0.04) !important;
        }
        .monaco-editor .lines-decorations {
            background: transparent !important;
        }

        /* Breadcrumbs bar */
        .monaco-workbench .part.editor .breadcrumbs-below-tabs,
        .monaco-workbench .breadcrumbs-widget {
            background-color: #1f1f1f !important;
        }
    </style>
</head>
<body aria-label="">
    <div id="votion-splash">
        <div class="votion-spinner"></div>
        <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.2px;">Opening Votion Code Lite...</div>
        <div style="font-size: 11px; color: #8b949e; margin-top: 6px; font-family: monospace;">Mounting server workspace via REST API</div>
    </div>

    <!-- Startup script -->
    <script>
        const baseUrl = new URL('.', window.location.href).toString().replace(/\/+$/, '');
        globalThis._VSCODE_FILE_ROOT = baseUrl + '/out/';
    </script>
    <script type="module" src="./out/nls.messages.js"></script>
    <script type="module">
        import { create, URI, Emitter, Event } from './out/vs/workbench/workbench.web.main.internal.js?v=2.6';

        // Retrieve server UUID from query params
        const urlParams = new URLSearchParams(window.location.search);
        const serverUuid = (urlParams.get('server') || '').toLowerCase();

        // Extract CSRF token
        let csrfToken = urlParams.get('csrf') || '';
        if (!csrfToken) {
            const m = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            if (m) csrfToken = decodeURIComponent(m[1]);
        }
        if (!csrfToken) {
            try {
                if (window.parent && window.parent.document) {
                    const meta = window.parent.document.querySelector('meta[name="csrf-token"]');
                    if (meta) csrfToken = meta.getAttribute('content') || '';
                    if (!csrfToken && window.parent.document.cookie) {
                        const pm = window.parent.document.cookie.match(/XSRF-TOKEN=([^;]+)/);
                        if (pm) csrfToken = decodeURIComponent(pm[1]);
                    }
                }
            } catch (e) {}
        }

        function createFsError(message, code) {
            const err = new Error(message);
            err.name = `${code} (FileSystemError)`;
            err.code = code;
            return err;
        }

        function encodePath(path) {
            if (!path || path === '/' || path === '') return '/';
            let p = path.replace(/\\/g, '/');
            if (!p.startsWith('/')) p = '/' + p;
            if (p.length > 1 && p.endsWith('/')) p = p.substring(0, p.length - 1);
            return p.split('/').map(s => encodeURIComponent(s)).join('/');
        }

        class PterodactylFileSystemProvider {
            constructor(uuid, csrf) {
                this.serverUuid = uuid;
                this.csrfToken = csrf;
                // FileReadWrite (2) | PathCaseSensitive (1024)
                this.capabilities = 2 | 1024;
                this._onDidChangeFile = new Emitter();
                this.onDidChangeFile = this._onDidChangeFile.event;
                this.onDidChangeCapabilities = Event.None;
                this.cache = new Map();
            }

            getCleanPath(resource) {
                let p = (resource && resource.path) ? resource.path : '/';
                p = p.replace(/\\/g, '/');
                if (!p.startsWith('/')) p = '/' + p;
                if (p.length > 1 && p.endsWith('/')) p = p.substring(0, p.length - 1);
                return p;
            }

            async request(endpoint, options = {}) {
                const origin = window.location.origin;
                const url = origin + '/api/client/servers/' + this.serverUuid + endpoint;
                const headers = {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    ...(this.csrfToken ? {
                        'X-CSRF-TOKEN': this.csrfToken,
                        'X-XSRF-TOKEN': this.csrfToken
                    } : {}),
                    ...(options.headers || {})
                };

                const res = await fetch(url, {
                    ...options,
                    credentials: 'include',
                    headers
                });

                if (!res.ok) {
                    let detail = '';
                    try {
                        const json = await res.json();
                        detail = json?.errors?.[0]?.detail || json?.message || '';
                    } catch (e) {}

                    const errMsg = detail || res.statusText || `HTTP ${res.status}`;
                    console.warn(`[VotionCodeLite] API ${res.status} on ${endpoint}: ${errMsg}`);

                    if (res.status === 404 || (res.status === 500 && endpoint.includes('/files/contents'))) {
                        throw createFsError(detail || 'File not found', 'EntryNotFound');
                    }
                    if (res.status === 403) {
                        throw createFsError(detail || 'Permission denied', 'NoPermissions');
                    }
                    throw new Error('Pterodactyl API error (' + res.status + '): ' + errMsg);
                }
                return res;
            }

            async stat(resource) {
                const path = this.getCleanPath(resource);
                if (path === '/' || path === '') {
                    return {
                        type: 2, // Directory
                        ctime: 0,
                        mtime: 0,
                        size: 0,
                        permissions: undefined
                    };
                }

                if (this.cache.has(path)) {
                    return this.cache.get(path);
                }
                const relPath = path.startsWith('/') ? path.substring(1) : path;
                if (this.cache.has(relPath)) {
                    return this.cache.get(relPath);
                }

                // Query parent directory to populate child stats
                const lastSlash = path.lastIndexOf('/');
                const parentDir = lastSlash <= 0 ? '/' : path.substring(0, lastSlash);
                try {
                    await this.readdir({ path: parentDir });
                } catch (e) {
                    console.warn('[VotionCodeLite] Parent readdir failed for ' + path, e);
                }

                if (this.cache.has(path)) {
                    return this.cache.get(path);
                }
                if (this.cache.has(relPath)) {
                    return this.cache.get(relPath);
                }

                throw createFsError('File not found: ' + path, 'EntryNotFound');
            }

            async readdir(resource) {
                const dir = this.getCleanPath(resource);
                const queryDir = (dir === '/' || dir === '') ? '/' : dir;

                console.log('[VotionCodeLite] Listing directory: "' + queryDir + '"');

                try {
                    const encodedDir = encodePath(queryDir);
                    const res = await this.request('/files/list?directory=' + encodedDir);
                    const json = await res.json();
                    const items = json.data || [];

                    const result = [];
                    for (const item of items) {
                        const attr = item.attributes;
                        if (!attr || !attr.name) continue;
                        const isFile = attr.is_file ?? (attr.file ?? true);
                        const type = isFile ? 1 : 2;
                        result.push([attr.name, type]);

                        const childPath = dir === '/' ? '/' + attr.name : dir + '/' + attr.name;
                        const relChildPath = childPath.startsWith('/') ? childPath.substring(1) : childPath;
                        const statObj = {
                            type,
                            ctime: attr.created_at ? new Date(attr.created_at).getTime() : 0,
                            mtime: attr.modified_at ? new Date(attr.modified_at).getTime() : 0,
                            size: typeof attr.size === 'number' ? attr.size : (Number(attr.size) || 0),
                            permissions: undefined
                        };
                        this.cache.set(childPath, statObj);
                        this.cache.set(relChildPath, statObj);
                    }
                    return result;
                } catch (err) {
                    console.warn('[VotionCodeLite] Failed to list directory "' + queryDir + '":', err);
                    return [];
                }
            }

            async readFile(resource) {
                const path = this.getCleanPath(resource);
                console.log('[VotionCodeLite] Reading file: "' + path + '"');
                try {
                    const res = await this.request('/files/contents?file=' + encodePath(path));
                    const buf = await res.arrayBuffer();
                    return new Uint8Array(buf);
                } catch (err) {
                    throw createFsError('File not found: ' + path, 'EntryNotFound');
                }
            }

            async writeFile(resource, content, opts) {
                const path = this.getCleanPath(resource);
                console.log('[VotionCodeLite] Writing file: "' + path + '"');
                await this.request('/files/write?file=' + encodePath(path), {
                    method: 'POST',
                    body: content,
                    headers: { 'Content-Type': 'text/plain' }
                });

                this.cache.delete(path);
                const rel = path.startsWith('/') ? path.substring(1) : path;
                this.cache.delete(rel);
                this._onDidChangeFile.fire([{ type: 0 /* Updated */, resource }]);
            }

            async mkdir(resource) {
                const path = this.getCleanPath(resource);
                const lastSlash = path.lastIndexOf('/');
                const root = lastSlash <= 0 ? '/' : path.substring(0, lastSlash);
                const name = path.substring(lastSlash + 1);

                console.log('[VotionCodeLite] Creating folder: root="' + root + '", name="' + name + '"');
                await this.request('/files/create-folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ root, name })
                });

                this.cache.delete(path);
                const rel = path.startsWith('/') ? path.substring(1) : path;
                this.cache.delete(rel);
                this._onDidChangeFile.fire([{ type: 1 /* Added */, resource }]);
            }

            async delete(resource, opts) {
                const path = this.getCleanPath(resource);
                const lastSlash = path.lastIndexOf('/');
                const root = lastSlash <= 0 ? '/' : path.substring(0, lastSlash);
                const name = path.substring(lastSlash + 1);

                console.log('[VotionCodeLite] Deleting: root="' + root + '", name="' + name + '"');
                await this.request('/files/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ root, files: [name] })
                });

                this.cache.delete(path);
                const rel = path.startsWith('/') ? path.substring(1) : path;
                this.cache.delete(rel);
                this._onDidChangeFile.fire([{ type: 2 /* Deleted */, resource }]);
            }

            async rename(from, to, opts) {
                const fromPath = this.getCleanPath(from);
                const toPath = this.getCleanPath(to);

                const fromLastSlash = fromPath.lastIndexOf('/');
                const root = fromLastSlash <= 0 ? '/' : fromPath.substring(0, fromLastSlash);
                const fromName = fromPath.substring(fromLastSlash + 1);
                const toName = toPath.substring(toPath.lastIndexOf('/') + 1);

                console.log('[VotionCodeLite] Renaming: "' + fromPath + '" -> "' + toPath + '"');
                await this.request('/files/rename', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ root, files: [{ from: fromName, to: toName }] })
                });

                this.cache.delete(fromPath);
                this.cache.delete(toPath);
                const relFrom = fromPath.startsWith('/') ? fromPath.substring(1) : fromPath;
                const relTo = toPath.startsWith('/') ? toPath.substring(1) : toPath;
                this.cache.delete(relFrom);
                this.cache.delete(relTo);

                this._onDidChangeFile.fire([
                    { type: 2 /* Deleted */, resource: from },
                    { type: 1 /* Added */, resource: to }
                ]);
            }

            watch(resource, opts) {
                return { dispose: () => {} };
            }
        }

        const workspaceFolderUri = URI.from({
            scheme: 'ptero',
            authority: serverUuid,
            path: '/'
        });

        const pteroFsProvider = new PterodactylFileSystemProvider(serverUuid, csrfToken);
        // Expose globally so workbench.web.main.internal.js can auto-register whenever needed
        window.pteroFsProvider = pteroFsProvider;

        function dismissSplash() {
            const splash = document.getElementById('votion-splash');
            if (splash && splash.style.opacity !== '0') {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 400);
            }
        }

        // Clear any stale cached theme settings from localStorage so VS Code Web reliably initializes in Dark Modern
        try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                if (k && (k.includes('theme') || k.includes('colorTheme') || k.includes('colorCustomizations'))) {
                    localStorage.removeItem(k);
                }
            }
        } catch (e) {}

        const darkModernCustomizations = {
            "panel.background": "#181818",
            "panel.border": "#2b2b2b",
            "panelTitle.activeBorder": "#0078d4",
            "panelTitle.activeForeground": "#ffffff",
            "panelTitle.inactiveForeground": "#9d9d9d",
            "terminal.background": "#181818",
            "terminal.foreground": "#cccccc",
            "terminal.border": "#2b2b2b",
            "terminalCursor.foreground": "#ffffff",
            "editorGroupHeader.tabsBackground": "#181818",
            "editorGroupHeader.noTabsBackground": "#181818",
            "tab.activeBackground": "#1f1f1f",
            "tab.inactiveBackground": "#181818",
            "tab.activeForeground": "#ffffff",
            "tab.inactiveForeground": "#9d9d9d",
            "tab.border": "#2b2b2b",
            "tab.activeBorderTop": "#0078d4",
            "sideBar.background": "#181818",
            "sideBar.border": "#2b2b2b",
            "sideBarSectionHeader.background": "#181818",
            "sideBarSectionHeader.border": "#2b2b2b",
            "sideBarSectionHeader.foreground": "#cccccc",
            "sideBarTitle.foreground": "#cccccc",
            "editor.background": "#1f1f1f",
            "editor.foreground": "#cccccc",
            "editor.lineHighlightBackground": "#ffffff0a",
            "editor.lineHighlightBorder": "#00000000",
            "editorWidget.background": "#1f1f1f",
            "editorWidget.border": "#2b2b2b",
            "editorWidget.foreground": "#cccccc",
            "list.activeSelectionBackground": "#04395e",
            "list.activeSelectionForeground": "#ffffff",
            "list.inactiveSelectionBackground": "#2a2d2e",
            "list.inactiveSelectionForeground": "#cccccc",
            "list.hoverBackground": "#2a2d2e",
            "list.focusBackground": "#04395e",
            "activityBar.background": "#181818",
            "activityBar.border": "#2b2b2b",
            "statusBar.background": "#181818",
            "statusBar.border": "#2b2b2b",
            "titleBar.activeBackground": "#181818",
            "titleBar.border": "#2b2b2b",
            "breadcrumb.background": "#1f1f1f",
            "breadcrumb.foreground": "#9d9d9d",
            "breadcrumb.focusForeground": "#e0e0e0",
            "breadcrumb.activeSelectionForeground": "#ffffff",
            "input.background": "#1f1f1f",
            "input.foreground": "#cccccc",
            "input.border": "#2b2b2b",
            "dropdown.background": "#1f1f1f",
            "dropdown.border": "#2b2b2b",
            "dropdown.foreground": "#cccccc"
        };

        try {
            create(document.body, {
                fileSystemProviders: [
                    {
                        scheme: 'ptero',
                        provider: pteroFsProvider
                    }
                ],
                workspaceProvider: {
                    workspace: {
                        folderUri: workspaceFolderUri
                    },
                    open: async () => true
                },
                initialColorTheme: {
                    themeType: 'dark',
                    colors: darkModernCustomizations
                },
                configurationDefaults: {
                    "workbench.colorTheme": "Default Dark Modern",
                    "workbench.preferredDarkColorTheme": "Default Dark Modern",
                    "workbench.preferredLightColorTheme": "Default Dark Modern",
                    "workbench.preferredHighContrastColorTheme": "Default Dark Modern",
                    "workbench.preferredHighContrastLightColorTheme": "Default Dark Modern",
                    "window.autoDetectColorScheme": false,
                    "window.autoDetectHighContrast": false,
                    "workbench.startupEditor": "none",
                    "workbench.welcomePage.walkthroughs.openOnInstall": false,
                    "workbench.tips.enabled": false,
                    "workbench.panel.defaultLocation": "bottom",
                    "files.autoSave": "onFocusChange",
                    "workbench.colorCustomizations": darkModernCustomizations
                },
                productConfiguration: {
                    nameShort: 'Votion Code',
                    nameLong: 'Votion Code Lite',
                    applicationName: 'votion-code-lite',
                    webEndpointUrlTemplate: '',
                    commit: '',
                    quality: 'stable'
                }
            });

            // Smoothly remove splash screen as soon as the workbench DOM element is mounted
            let splashDismissed = false;
            const checkWorkbench = () => {
                if (splashDismissed) return;
                if (document.querySelector('.monaco-workbench')) {
                    splashDismissed = true;
                    dismissSplash();
                }
            };

            const observer = new MutationObserver(() => checkWorkbench());
            observer.observe(document.body, { childList: true, subtree: true });
            const checkTimer = setInterval(checkWorkbench, 100);

            // Safety timeout
            setTimeout(() => {
                clearInterval(checkTimer);
                observer.disconnect();
                dismissSplash();
            }, 3000);
        } catch (err) {
            console.error('Failed to initialize Votion Code Lite:', err);
            const splash = document.getElementById('votion-splash');
            if (splash) {
                splash.innerHTML = `
                    <div style="color: #f85149; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Failed to initialize Votion Code Lite</div>
                    <div style="color: #8b949e; font-size: 12px; font-family: monospace; max-width: 480px; text-align: center;">${err.message || err}</div>
                `;
            }
        }
    </script>
</body>
</html>
