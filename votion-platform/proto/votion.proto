syntax = "proto3";

package votion.node.v1;

option go_package = "votion/proto/v1";

// ==========================================
// Service: NodeService
// Main host daemon management RPC interface
// ==========================================
service NodeService {
  // Host Node Information & Metrics
  rpc GetNodeInfo(NodeInfoRequest) returns (NodeInfoResponse);
  rpc GetNodeStats(NodeStatsRequest) returns (NodeStatsResponse);

  // Container Lifecycle Operations
  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc KillContainer(KillContainerRequest) returns (KillContainerResponse);
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);

  // Status & Telemetry
  rpc GetContainerStatus(GetContainerStatusRequest) returns (ContainerStatusResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc StreamContainerStats(StreamContainerStatsRequest) returns (stream ContainerStatsEvent);
  rpc StreamContainerLogs(StreamContainerLogsRequest) returns (stream ContainerLogEvent);

  // Live Interactions & Commands
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  rpc SetContainerHibernation(SetContainerHibernationRequest) returns (SetContainerHibernationResponse);
  rpc SyncContainerConfig(SyncContainerConfigRequest) returns (SyncContainerConfigResponse);
}

// ==========================================
// Container State Enums
// ==========================================
enum ContainerState {
  CONTAINER_STATE_UNKNOWN = 0;
  CONTAINER_STATE_CREATING = 1;
  CONTAINER_STATE_STARTING = 2;
  CONTAINER_STATE_RUNNING = 3;
  CONTAINER_STATE_HIBERNATING = 4;
  CONTAINER_STATE_STOPPING = 5;
  CONTAINER_STATE_STOPPED = 6;
  CONTAINER_STATE_CRASHED = 7;
}

// ==========================================
// Resource Configuration (cgroups v2)
// ==========================================
message ResourceLimits {
  // cgroups v2 cpu.weight (1 - 10000, default: 100)
  uint32 cpu_weight = 1;
  // Percentage cap (e.g. 100 = 100% of 1 core, 200 = 2 cores, 0 = unlimited)
  uint32 cpu_limit_percent = 2;
  // cgroups v2 memory.max in bytes
  uint64 memory_limit_bytes = 3;
  // cgroups v2 memory.high in bytes (triggers memory reclamation without killing)
  uint64 memory_high_bytes = 4;
  // Swap limit in bytes (0 = disabled swap)
  uint64 memory_swap_bytes = 5;
  // Disk space limit in bytes
  uint64 disk_limit_bytes = 6;
  // IO weight (1 - 10000)
  uint32 io_weight = 7;
  // Network egress throttle in Kbps (0 = unlimited)
  uint64 network_bandwidth_kbps = 8;
}

// ==========================================
// Network & Port Allocation
// ==========================================
message PortAllocation {
  string host_ip = 1;
  uint32 host_port = 2;
  uint32 container_port = 3;
  string protocol = 4; // "tcp" or "udp"
}

// ==========================================
// Storage Volume Mounts
// ==========================================
message MountBinding {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

// ==========================================
// Zero-Player Hibernation Configuration
// ==========================================
message HibernationConfig {
  bool enabled = 1;
  // Inactivity threshold before freezing cgroup
  uint32 idle_timeout_seconds = 2;
  // Wake-on-packet via eBPF/XDP sniffer
  bool wake_on_packet = 3;
  // Ports to monitor for player traffic
  repeated uint32 listen_ports = 4;
  // Seconds to wait after empty player count before freezing
  uint32 grace_period_seconds = 5;
}

// ==========================================
// Full Container Specification
// ==========================================
message ContainerSpec {
  string id = 1;
  string name = 2;
  string image = 3;
  string entrypoint = 4;
  repeated string arguments = 5;
  string working_dir = 6;
  map<string, string> environment = 7;
  ResourceLimits limits = 8;
  repeated PortAllocation ports = 9;
  repeated MountBinding mounts = 10;
  HibernationConfig hibernation = 11;
  // Pterodactyl stop signal or command
  string stop_signal = 12; // e.g. "SIGTERM" or "stop"
  uint32 stop_timeout_seconds = 13;
}

// ==========================================
// Request & Response Definitions
// ==========================================
message NodeInfoRequest {}

message NodeInfoResponse {
  string node_id = 1;
  string hostname = 2;
  string os = 3;
  string kernel_version = 4;
  uint32 cpu_cores = 5;
  uint64 total_memory_bytes = 6;
  uint64 total_disk_bytes = 7;
  string daemon_version = 8;
  bool ebpf_supported = 9;
  bool cgroups_v2_active = 10;
}

message NodeStatsRequest {}

message NodeStatsResponse {
  double cpu_usage_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 disk_used_bytes = 3;
  uint32 active_containers = 4;
  uint32 hibernating_containers = 5;
  uint64 uptime_seconds = 6;
}

message CreateContainerRequest {
  ContainerSpec spec = 1;
}

message CreateContainerResponse {
  bool success = 1;
  string container_id = 2;
  string error_message = 3;
}

message StartContainerRequest {
  string container_id = 1;
}

message StartContainerResponse {
  bool success = 1;
  string error_message = 2;
}

message StopContainerRequest {
  string container_id = 1;
  uint32 timeout_seconds = 2;
}

message StopContainerResponse {
  bool success = 1;
  string error_message = 2;
}

message KillContainerRequest {
  string container_id = 1;
  string signal = 2; // e.g. "SIGKILL"
}

message KillContainerResponse {
  bool success = 1;
  string error_message = 2;
}

message DeleteContainerRequest {
  string container_id = 1;
  bool remove_data = 2;
}

message DeleteContainerResponse {
  bool success = 1;
  string error_message = 2;
}

message GetContainerStatusRequest {
  string container_id = 1;
}

message ContainerStatusResponse {
  string container_id = 1;
  ContainerState state = 2;
  int32 exit_code = 3;
  uint64 uptime_seconds = 4;
  string ip_address = 5;
  bool is_hibernating = 6;
  string error_message = 7;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated ContainerStatusResponse containers = 1;
}

message StreamContainerStatsRequest {
  string container_id = 1;
  uint32 interval_ms = 2; // e.g. 1000
}

message ContainerStatsEvent {
  string container_id = 1;
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
  uint64 memory_limit_bytes = 4;
  uint64 disk_bytes = 5;
  uint64 network_rx_bytes = 6;
  uint64 network_tx_bytes = 7;
  uint64 timestamp_ms = 8;
  bool is_hibernating = 9;
}

message StreamContainerLogsRequest {
  string container_id = 1;
  uint32 tail_lines = 2;
  bool follow = 3;
}

message ContainerLogEvent {
  string container_id = 1;
  bytes data = 2;
  int64 timestamp_ms = 3;
  bool is_stderr = 4;
}

message SendCommandRequest {
  string container_id = 1;
  string command = 2;
}

message SendCommandResponse {
  bool success = 1;
  string error_message = 2;
}

message SetContainerHibernationRequest {
  string container_id = 1;
  bool hibernate = 2;
}

message SetContainerHibernationResponse {
  bool success = 1;
  bool is_hibernating = 2;
  string error_message = 3;
}

message SyncContainerConfigRequest {
  ContainerSpec spec = 1;
}

message SyncContainerConfigResponse {
  bool success = 1;
  string error_message = 2;
}
