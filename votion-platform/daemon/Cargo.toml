[package]
name = "votion-node"
version = "2.0.0"
edition = "2021"
authors = ["Votion Team <support@votion.app>"]
description = "Next-generation low-overhead host node daemon for game servers"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.12"
prost = "0.13"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
sysinfo = "0.33"
chrono = "0.4"
uuid = { version = "1.13", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "fs", "term"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[lib]
name = "votion_node"
path = "src/lib.rs"

[[bin]]
name = "votion-node"
path = "src/main.rs"
